# One service per instance, same image, separate configuration and data.
#
# Ports are bound to 127.0.0.1 on purpose: TLS and public reachability are the
# reverse proxy's job (Caddy or nginx on the host). For traefik, add the
# overlay:
#   docker compose -f docker-compose.yml -f docker-compose.traefik.yml up -d

services:
  promptory-privat:
    build: .
    image: promptory:latest
    container_name: promptory-privat
    restart: unless-stopped
    env_file: .env.privat
    volumes:
      - privat-data:/data
    ports:
      - "127.0.0.1:8081:8080"

  promptory-arbeit:
    build: .
    image: promptory:latest
    container_name: promptory-arbeit
    restart: unless-stopped
    env_file: .env.arbeit
    volumes:
      - arbeit-data:/data
    ports:
      - "127.0.0.1:8082:8080"

volumes:
  privat-data:
  arbeit-data:
