# One service per instance, same image, separate configuration and data.
#
# Ports are bound to 127.0.0.1 on purpose: TLS and public reachability are the
# reverse proxy's job (Caddy or nginx on the host). For traefik, add the
# overlay:
#   docker compose -f docker-compose.yml -f docker-compose.traefik.yml up -d

services:
  grimoire-personal:
    build: .
    image: grimoire:latest
    container_name: grimoire-personal
    restart: unless-stopped
    env_file: .env.personal
    volumes:
      - personal-data:/data
    ports:
      - "127.0.0.1:8081:8080"

  grimoire-work:
    build: .
    image: grimoire:latest
    container_name: grimoire-work
    restart: unless-stopped
    env_file: .env.work
    volumes:
      - work-data:/data
    ports:
      - "127.0.0.1:8082:8080"

volumes:
  personal-data:
  work-data:
