# traefik overlay: no published ports, labels and the external network instead.
#
#   docker compose -f docker-compose.yml -f docker-compose.traefik.yml up -d
#
# Expects a network named "traefik" that traefik is attached to, and a
# certificate resolver named "le" (rename to match your setup).

services:
  grimoire-personal:
    ports: !reset []
    networks: [traefik]
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik
      traefik.http.routers.grimoire-personal.rule: "Host(`prompts.example.org`)"
      traefik.http.routers.grimoire-personal.entrypoints: websecure
      traefik.http.routers.grimoire-personal.tls.certresolver: le
      traefik.http.services.grimoire-personal.loadbalancer.server.port: "8080"

  grimoire-work:
    ports: !reset []
    networks: [traefik]
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik
      traefik.http.routers.grimoire-work.rule: "Host(`prompts-work.example.org`)"
      traefik.http.routers.grimoire-work.entrypoints: websecure
      traefik.http.routers.grimoire-work.tls.certresolver: le
      traefik.http.services.grimoire-work.loadbalancer.server.port: "8080"

networks:
  traefik:
    external: true
