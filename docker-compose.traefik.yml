# traefik overlay: no published ports, labels and the external network instead.
#
#   docker compose -f docker-compose.yml -f docker-compose.traefik.yml up -d
#
# Expects a network named "traefik" that traefik is attached to, and a
# certificate resolver named "le" (rename to match your setup).

services:
  promptory-privat:
    ports: !reset []
    networks: [traefik]
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik
      traefik.http.routers.promptory-privat.rule: "Host(`prompts.example.org`)"
      traefik.http.routers.promptory-privat.entrypoints: websecure
      traefik.http.routers.promptory-privat.tls.certresolver: le
      traefik.http.services.promptory-privat.loadbalancer.server.port: "8080"

  promptory-arbeit:
    ports: !reset []
    networks: [traefik]
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik
      traefik.http.routers.promptory-arbeit.rule: "Host(`prompts-arbeit.example.org`)"
      traefik.http.routers.promptory-arbeit.entrypoints: websecure
      traefik.http.routers.promptory-arbeit.tls.certresolver: le
      traefik.http.services.promptory-arbeit.loadbalancer.server.port: "8080"

networks:
  traefik:
    external: true
