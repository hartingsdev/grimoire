# Local testing only: a mock OIDC provider to exercise every role and the
# "no matching group" case without touching the real IdP.
#
#   docker compose -f docker-compose.dev.yml up -d
#   ./scripts/dev.sh
#
# The app deliberately runs outside Docker here, so browser and app use the same
# provider address (http://localhost:8090/default) and no issuer mismatch arises.

services:
  mock-oidc:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    container_name: promptory-mock-oidc
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      SERVER_PORT: "8090"
      # interactiveLogin shows a form at sign-in where subject and arbitrary
      # claims (groups included) can be entered.
      JSON_CONFIG: >-
        {"interactiveLogin":true,
         "tokenProvider":{"keyProvider":{"initialKeys":null,"algorithm":"RS256"}}}
